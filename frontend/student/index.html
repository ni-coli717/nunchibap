<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>눈치밥</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 레이아웃: 폰에서는 전체 화면, 넓은 화면에서는 390×844 폰 틀을 가운데에 놓는다 */
:root{--paper:#F4F3EF;--ink:#111111;--white:#FFFFFF;--yellow:#FFE14D;--grey:#555555;--line:#111111;--mute:#6B6B6B;--red:#B42318;--tape:rgba(226,219,198,.9);--stripe:repeating-linear-gradient(135deg,#FFFFFF 0px,#FFFFFF 7px,#C9C9C9 7px,#C9C9C9 8.5px);--desk:#E7E5DE;--sans:'Noto Sans KR',Arial,sans-serif;--mono:'IBM Plex Mono','Courier New',monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--desk:#1C1C1A;color-scheme:dark}}
:root[data-theme="dark"]{--desk:#1C1C1A;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font-family:inherit;color:inherit;cursor:pointer;border-radius:0}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #2457D6;outline-offset:1px}
input{font-family:inherit;color:var(--ink);border-radius:0}
/* ---------- 반응형 틀 ----------
   ~599px  : 폰 전체 화면
   600~1023: 종이 책상 위 폰 화면 (390px)
   1024px~ : 로그인 전 = 브랜드 + 가입 카드 2단 / 로그인 후 = 오늘 패널 + 작업 패널 2단 */
html,body,#root{height:100%}
#root{position:relative;overflow:hidden}
.m-full{height:100%;display:flex;flex-direction:column;background:var(--paper)}
.m-full>.phone{flex:1;min-height:0}
.m-desk{height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
.phone{position:relative;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;background:var(--paper)}
.m-desk .phone{width:390px;max-width:100%;height:min(844px,100%);border:3px solid var(--ink);box-shadow:8px 10px 0 rgba(0,0,0,.18)}
/* 데스크톱 · 로그인 전 */
.da{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:64px;align-items:center;max-width:1120px;margin:0 auto;padding:32px 48px}
.da-brand{display:flex;flex-direction:column;gap:0;min-width:0}
.da-brand h1{margin:20px 0 0;font-size:96px;font-weight:900;letter-spacing:-5px;line-height:1}
.da-steps{margin:40px 0 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:3px solid var(--ink);border-left:3px solid var(--ink);background:var(--white);max-width:560px}
.da-steps div{padding:14px 16px;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);display:flex;flex-direction:column;gap:4px}
.da-steps .t{font-family:var(--mono);font-size:15px;font-weight:600}
.da-steps .w{font-size:14px;font-weight:900}
.da-steps .s{font-size:12px;color:var(--grey);line-height:1.45}
.da-card{position:relative;height:min(700px,100%);border:3px solid var(--ink);background:var(--paper);box-shadow:8px 10px 0 rgba(0,0,0,.12);overflow:hidden;display:flex;flex-direction:column}
/* 데스크톱 · 로그인 후 */
.dw{height:100%;display:flex;flex-direction:column}
.dw-top{flex:none;display:flex;align-items:center;gap:24px;height:64px;padding:0 32px;background:var(--white);border-bottom:3px solid var(--ink)}
.dw-brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:900;letter-spacing:-.5px}
.dw-brand .mono{font-size:12px;font-weight:600;color:var(--grey);letter-spacing:0}
.dw-nav{display:flex;height:100%;margin-left:16px}
.dw-nav button{height:100%;padding:0 20px;border:0;border-left:1px solid var(--ink);background:transparent;font-size:15px;font-weight:500}
.dw-nav button:last-child{border-right:1px solid var(--ink)}
.dw-nav button[aria-current="page"]{background:var(--ink);color:var(--white);font-weight:700}
.dw-me{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--grey)}
.dw-me b{color:var(--ink)}
.dw-me button{min-height:36px;padding:0 12px;border:2px solid var(--ink);background:var(--yellow);font-size:13px;font-weight:700}
.dw-body{flex:1;min-height:0;display:grid;grid-template-columns:420px minmax(0,680px);justify-content:center;align-items:start;align-content:center;gap:24px;padding:24px 32px}
.pane{position:relative;min-height:0;max-height:100%;border:3px solid var(--ink);background:var(--paper);overflow:hidden;display:flex;flex-direction:column}
.dw .tabbar{display:none}
.dw .pane-today .screen{animation:none}
.dw .sheet .postit{--r:-.6deg!important}
@media (min-width:1280px){.dw-body{grid-template-columns:440px minmax(0,760px);gap:32px}}
@media (min-width:1600px){.dw-body{grid-template-columns:480px minmax(0,880px);padding:32px 48px}}
@media (max-width:1100px){.da{grid-template-columns:minmax(0,1fr) 400px;gap:40px;padding:24px 32px}.da-brand h1{font-size:80px}}

/* 모션 */
@keyframes nbIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes nbSlide{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes nbStick{0%{opacity:0;transform:translateY(-38px) rotate(calc(var(--r,0deg) - 11deg)) scale(1.07)}55%{opacity:1;transform:translateY(4px) rotate(calc(var(--r,0deg) + 3deg)) scale(1)}78%{transform:translateY(-1px) rotate(calc(var(--r,0deg) - 1.2deg))}100%{transform:rotate(var(--r,0deg))}}
@keyframes nbSheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes nbDim{from{opacity:0}to{opacity:1}}
@keyframes nbStamp{0%{opacity:0;transform:scale(1.9) rotate(-24deg)}65%{opacity:1;transform:scale(.9) rotate(-10deg)}100%{opacity:1;transform:scale(1) rotate(-12deg)}}
@keyframes nbPop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.08)}100%{transform:none}}
@keyframes nbGlance{0%,38%{transform:translateX(0)}46%,78%{transform:translateX(-8px)}86%,100%{transform:translateX(0)}}
@keyframes nbGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes nbShake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;animation:nbIn 300ms cubic-bezier(.2,.8,.2,1) both}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
.slide{animation:nbSlide 320ms cubic-bezier(.2,.8,.2,1) both}
.stag{animation:nbIn 340ms cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0) * 35ms)}
.postit{position:relative;background:var(--yellow);border:3px solid var(--ink);color:var(--ink);transform:rotate(var(--r,0deg));transform-origin:50% 0;animation:nbStick 620ms cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0ms);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.postit:hover{transform:rotate(0deg) translateY(-3px)}
.tape{position:absolute;top:-14px;left:50%;width:64px;height:22px;margin-left:-32px;background:var(--tape);transform:rotate(-4deg);pointer-events:none}
.sheet{animation:nbSheet 380ms cubic-bezier(.2,.8,.2,1) both}
.dim{animation:nbDim 260ms ease both}
.stamp{transform:rotate(-12deg);animation:nbStamp 460ms 420ms cubic-bezier(.2,.8,.2,1) backwards}
.pop{animation:nbPop 420ms cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0ms)}
.eyes{animation:nbGlance 3.4s ease-in-out infinite}
.grow{transform-origin:50% 100%;animation:nbGrow 520ms cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0) * 70ms)}
.shake{animation:nbShake 380ms ease}
.btn{transition:transform .08s ease,background-color .15s,color .15s}
.btn:active{transform:translateY(2px)}
.cell{transition:background-color .18s,color .18s,box-shadow .18s,transform .1s}
.cell:active{transform:scale(.97)}
.knob{transition:left .2s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* 공통 부품 */
.mono{font-family:var(--mono)}
.head{padding:14px 20px 12px;background:var(--white);border-bottom:2px solid var(--line)}
.head h1{margin:2px 0 0;font-size:24px;font-weight:900;letter-spacing:-.5px}
.head .sub{font-size:12px;color:var(--grey);margin-top:2px}
.back{padding:0;min-height:32px;border:0;background:transparent;font-size:13px;font-weight:700}
.primary{width:100%;min-height:54px;border:2px solid var(--ink);background:var(--ink);color:var(--white);font-size:16px;font-weight:700}
.secondary{width:100%;min-height:50px;border:2px solid var(--ink);background:var(--white);color:var(--ink);font-size:15px;font-weight:700}
.ghost{min-height:54px;display:flex;align-items:center;justify-content:center;border:2px dashed #9A9A9A;color:var(--mute);font-size:15px;font-weight:700}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:#333}
.input{min-height:52px;width:100%;padding:0 14px;border:2px solid var(--ink);background:var(--white);font-size:16px}
.seg{display:grid;border:2px solid var(--ink);background:var(--white)}
.seg button{min-height:46px;padding:0 4px;border:0;border-right:2px solid var(--ink);background:var(--white);font-size:13px;font-weight:500}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--white);font-weight:700}
.gridopt{display:grid;border-top:2px solid var(--ink);border-left:2px solid var(--ink);background:var(--white)}
.gridopt button{min-height:46px;padding:0 4px;border:0;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);background:var(--white);font-size:13px;font-weight:500}
.gridopt button[aria-pressed="true"]{background:var(--ink);color:var(--white);font-weight:700}
.k-f{background:var(--white);color:var(--ink)}.k-m{background:var(--stripe);color:var(--ink)}.k-b{background:var(--ink);color:var(--white)}.k-y{background:var(--yellow);color:var(--ink)}
.tabbar{margin-top:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:2px solid var(--line);background:var(--white)}
.tabbar button{min-height:56px;border:0;border-right:1px solid var(--line);background:var(--white);font-size:14px;font-weight:500}
.tabbar button:last-child{border-right:0}
.tabbar button[aria-current="page"]{background:var(--ink);color:var(--white);font-weight:700}
.list{border-top:2px solid var(--ink);border-left:2px solid var(--ink);border-right:2px solid var(--ink);background:var(--white)}
.row{display:flex;justify-content:space-between;align-items:center;min-height:52px;padding:0 14px;border-bottom:2px solid var(--ink);width:100%;background:var(--white);border-left:0;border-right:0;border-top:0;text-align:left;font-size:14px;font-weight:700}
.switch{position:relative;width:52px;height:30px;padding:0;border:2px solid var(--ink);background:var(--white);transition:background-color .2s}
.switch[aria-checked="true"]{background:var(--ink)}
.switch .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;background:var(--ink)}
.switch[aria-checked="true"] .knob{left:25px;background:var(--yellow)}
.toast{position:fixed;left:16px;right:16px;bottom:80px;max-width:420px;margin:0 auto;z-index:9;padding:12px 14px;background:var(--ink);color:var(--yellow);font-size:13px;font-weight:700;animation:nbIn 240ms ease both}
.steps{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:2px solid var(--line);background:var(--white)}
.steps li{padding:8px 10px;border-right:1px solid var(--line);color:var(--mute);font-size:12px;font-weight:700;line-height:1.35}
.steps li:last-child{border-right:0}
.steps li.on{background:var(--ink);color:var(--white)}
.steps li span{font-weight:500}
.steps li button{padding:0;border:0;background:transparent;color:inherit;font:inherit;text-decoration:underline}
.hcell{height:48px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.slotbtn{height:60px;padding:8px 10px;border:0;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:6px;text-align:left}
.slotbtn[aria-pressed="true"]{box-shadow:inset 0 0 0 4px #2457D6}
.kv{width:100%;border-collapse:collapse;background:var(--white);font-size:13px}
.kv th,.kv td{border:2px solid var(--ink);padding:10px 12px;text-align:left}
.kv th{width:86px;background:#EDEDE9}
.chip{padding:6px 10px;border:2px solid var(--ink);background:var(--white);font-size:12px;font-weight:700}
.chip.off{border-style:dashed;border-color:#9A9A9A;color:var(--mute)}
</style>
</head>
<body>


<div id="root" aria-live="polite"></div>

<script src="nb-core.js"></script>
<script src="nb-bridge.js"></script>
<script>
(function () {
  'use strict';
  var S = NB.load();
  /* 화면 상태 (저장하지 않음) */
  var ui = { screen: S.user && S.user.introDone ? 'home' : 'splash', email: '', code: '', grade: '2', cls: '3', name: '', intro: 0, introFrom: 'signup', picked: null, rec: false, fb: { ate: '예', timing: '예약대로', bucket: null }, fbOut: {}, justSent: false, toast: null, invite: false, inviteName: '', editDay: null, privacy: false };
  var now = function () { return new Date(); };
  var SCHOOLS = function () { var m = {}; S.settings.domains.forEach(function (d) { if (d.ok) m[d.name] = S.settings.schoolName; }); return m; };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function bowl(kind, w) {
    w = w || 60; var h = Math.round(w * 0.75);
    var face = kind === 'glance' ? '<g class="eyes"><rect x="50" y="42" width="8" height="12" fill="#111"/><rect x="80" y="42" width="8" height="12" fill="#111"/></g><rect x="44" y="62" width="40" height="6" fill="#FFE14D"/>'
      : kind === 'shock' ? '<rect x="46" y="43" width="8" height="8" fill="#111"/><rect x="76" y="43" width="8" height="8" fill="#111"/><rect x="58" y="62" width="12" height="10" fill="#FFF" stroke="#111" stroke-width="5"/>'
      : kind === 'happy' ? '<path d="M40 54 L50 42 L60 54" fill="none" stroke="#111" stroke-width="6"/><path d="M70 54 L80 42 L90 54" fill="none" stroke="#111" stroke-width="6"/><rect x="44" y="62" width="40" height="8" fill="#FFE14D"/><rect x="22" y="56" width="10" height="5" fill="#FFB8A8"/><rect x="96" y="56" width="10" height="5" fill="#FFB8A8"/>'
      : '<rect x="46" y="48" width="8" height="6" fill="#111"/><rect x="76" y="48" width="8" height="6" fill="#111"/>';
    var eyesBox = kind === 'shock' ? '<rect x="40" y="36" width="20" height="22" fill="#FFF" stroke="#111" stroke-width="5"/><rect x="70" y="36" width="20" height="22" fill="#FFF" stroke="#111" stroke-width="5"/>' : kind === 'happy' ? '' : '<rect x="40" y="40" width="20" height="16" fill="#FFF" stroke="#111" stroke-width="4"/><rect x="70" y="40" width="20" height="16" fill="#FFF" stroke="#111" stroke-width="4"/>';
    return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 128 96" role="img" aria-label="밥그릇 마스코트"><path d="M14 30 H114 L102 78 H26 Z" fill="#FFF" stroke="#111" stroke-width="4"/><path d="M22 30 C30 10, 98 10, 106 30" fill="#FFF" stroke="#111" stroke-width="4"/><rect x="38" y="80" width="52" height="12" fill="#111"/>' + eyesBox + face + '</svg>';
  }
  var LOGO = '<svg width="50" height="22" viewBox="0 0 150 66" role="img" aria-label="눈치밥"><g fill="#FFF" stroke="#111" stroke-width="7"><rect x="4" y="4" width="28" height="29"/><rect x="32" y="4" width="29" height="29" fill="#111"/><rect x="61" y="4" width="29" height="29" fill="#111"/><rect x="90" y="4" width="29" height="29"/><rect x="119" y="4" width="27" height="29"/><rect x="4" y="33" width="28" height="29"/><rect x="32" y="33" width="29" height="29"/><rect x="61" y="33" width="29" height="29"/><rect x="90" y="33" width="29" height="29" fill="#FFE14D"/><rect x="119" y="33" width="27" height="29"/></g></svg>';

  function emailKind() {
    var em = (ui.email || '').trim().toLowerCase(); var at = em.indexOf('@'); var dom = at > 0 ? em.slice(at + 1) : '';
    var school = SCHOOLS()[dom] || '';
    var kind = !em ? 'idle' : (at < 1 || dom.indexOf('.') < 0 || /\.$/.test(dom)) ? 'typing' : school ? 'ok' : /\.(hs|ms|es|sc)\.kr$|\.go\.kr$|\.ac\.kr$/.test(dom) ? 'missing' : 'bad';
    return { kind: kind, dom: dom, school: school };
  }

  /* ---------- 화면들 ---------- */
  function vSplash() {
    return '<div class="screen" style="padding:0 28px 28px"><div style="flex:1;display:flex;flex-direction:column;justify-content:center">' + bowl('glance', 168) +
      '<h1 style="margin:22px 0 0;font-size:52px;font-weight:900;letter-spacing:-2.5px;line-height:1">눈치밥</h1><div class="mono" style="font-size:15px;font-weight:600;margin-top:6px">nunchi-bap</div>' +
      '<div class="postit" style="--r:-2deg;--d:350ms;margin-top:34px;padding:18px 18px 16px;width:max-content;max-width:100%"><div class="tape"></div><div style="font-size:20px;font-weight:900">눈치 보지 말고, 눈치 있게</div><div style="font-size:14px;margin-top:4px">밥 먹을 타이밍, 눈치밥이 알려 줄게!</div></div></div>' +
      '<button class="primary btn" data-act="go" data-arg="email">학교 이메일로 시작하기</button><p style="margin:10px 0 0;font-size:12px;color:var(--grey);text-align:center">학교에서 받은 이메일만 쓸 수 있어요</p></div>';
  }
  function vEmail() {
    var e = emailKind();
    var demos = [['s25012@masong.hs.kr', '등록된 학교'], ['student@sample.hs.kr', '미등록 학교'], ['abc@gmail.com', '학교 메일 아님']];
    var status = e.kind === 'ok' ? '<div class="pop" style="margin-top:10px;display:flex;align-items:center;gap:10px;padding:10px 12px;border:2px solid var(--ink);background:var(--white)"><span style="width:22px;height:22px;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--yellow);font-size:14px;font-weight:900">✓</span><span style="display:flex;flex-direction:column"><b style="font-size:14px">' + esc(e.school) + '</b><span style="font-size:12px;color:#444">등록된 학교예요 · ' + esc(e.dom) + '</span></span></div>'
      : e.kind === 'missing' ? '<div class="pop" style="margin-top:10px;padding:10px 12px;border:2px dashed var(--ink);background:var(--white)"><b style="font-size:14px">아직 눈치밥을 쓰지 않는 학교예요</b><div style="font-size:12px;color:#444;margin-top:2px">' + esc(e.dom) + ' · 선생님께 도입을 요청할 수 있어요</div></div>'
      : e.kind === 'bad' ? '<div class="shake" style="margin-top:10px;padding:10px 12px;border:2px solid var(--red);background:var(--white);color:var(--red);font-size:13px;font-weight:700">학교에서 받은 이메일만 쓸 수 있어요</div>'
      : e.kind === 'typing' ? '<div style="margin-top:10px;font-size:12px;color:var(--grey)">@ 뒤 학교 주소까지 입력해 주세요</div>' : '';
    var cta = e.kind === 'ok' ? '<button class="primary btn" data-act="go" data-arg="code">인증 코드 받기</button>' : e.kind === 'missing' ? '<button class="secondary btn" style="min-height:54px;font-size:16px" data-act="go" data-arg="nope">우리 학교에 도입 요청하기</button>' : '<div class="ghost">학교 이메일을 입력해 주세요</div>';
    return '<div class="screen"><div class="head"><button class="back btn" data-act="go" data-arg="splash">← 처음으로</button><h1>학교 이메일로 가입</h1><div class="sub">이메일 주소로 우리 학교가 눈치밥을 쓰는지 바로 확인해요</div></div>' +

    var privacy = ui.privacy ? '<div class="pop" style="margin:12px 20px 0;padding:14px;border:2px solid var(--ink);background:var(--white);font-size:13px;line-height:1.6"><b>개인정보 처리 안내</b><br>저장: 학교 이메일(가입 확인용), 학년·반, 팀, 예약 칸, 하교 후 응답<br>저장하지 않음: 위치, 사진, 연락처, 실명(선택)<br>보관: 학기 종료 시 개인 기록 삭제, 통계만 남김<br>도입: 학교운영위원회 심의 후 운영</div>' : '';
    return '<div class="screen" style="min-height:0"><div class="head"><h1 style="margin:0">설정</h1></div><div class="scroll">' +
      '<div style="margin:16px 20px 0;border:2px solid var(--ink);background:var(--white);padding:12px 14px;display:flex;align-items:center;gap:12px"><span aria-hidden="true" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--yellow);border:2px solid var(--ink);font-size:18px;font-weight:900">' + esc((u.name || '나').slice(0, 1)) + '</span><div style="min-width:0"><div style="font-size:15px;font-weight:900">' + esc(u.name || '친구') + ' · ' + esc(u.grade) + '학년 ' + esc(u.cls) + '반</div><div class="mono" style="font-size:12px;color:var(--grey);overflow:hidden;text-overflow:ellipsis">' + esc(u.email) + '</div></div></div>' +
      '<div class="list" style="margin:16px 20px 0">' + tg('notif1', '전날 밤 예약 알림', '21:00 · 내일 메뉴와 혼잡 예상') + tg('notif2', '마감 알림', '07:00 · 휴대폰 내기 30분 전') + '</div>' +
      '<div class="list" style="margin:16px 20px 0"><button class="row btn" data-act="replayIntro" style="min-height:56px;background:var(--yellow);font-size:15px;font-weight:900"><span>사용법 다시 보기</span><span aria-hidden="true">→</span></button><button class="row btn" data-act="go" data-arg="recurring"><span>정기 예약 관리</span><span aria-hidden="true">→</span></button><button class="row btn" data-act="go" data-arg="team"><span>팀 관리</span><span aria-hidden="true">→</span></button><button class="row btn" data-act="privacy"><span>개인정보 처리 안내</span><span aria-hidden="true">' + (ui.privacy ? '↑' : '→') + '</span></button>' + (NBSync.active ? '<button class="row btn" data-act="nav" data-arg="admin"><span>관리자 웹 열기</span><span aria-hidden="true">→</span></button>' : '') + '<button class="row btn" data-act="logout" style="color:var(--red)">로그아웃</button></div>' + privacy +
      '<div style="margin:16px 20px 24px;font-size:11px;color:var(--grey);line-height:1.6">눈치밥 nunchi-bap · 마송고등학교 모의창업 · ' + (NBSync.active ? '시연 데이터는 학교 서버 한 곳에 모여 관리자 화면과 같이 보여요' : '시연 데이터는 이 기기에만 저장돼요') + '</div></div>' + tabbar('settings') + '</div>';
  }
  function tabbar(cur) {
    var t = [['home', '오늘'], ['recurring', '정기'], ['team', '팀'], ['record', '기록'], ['settings', '설정']];
    return '<nav class="tabbar" aria-label="하단 메뉴">' + t.map(function (x) { return '<button class="btn" data-act="go" data-arg="' + x[0] + '" aria-current="' + (cur === x[0] ? 'page' : 'false') + '">' + x[1] + '</button>'; }).join('') + '</nav>';
  }

  var views = { splash: vSplash, email: vEmail, nope: vNope, code: vCode, profile: vProfile, intro: vIntro, home: vHome, reserve: vReserve, confirm: vConfirm, feedback: vFeedback, record: vRecord, team: vTeam, recurring: vRecurring, settings: vSettings };
  var app = document.getElementById('root');
  var lastKey = null;
  var DESK = window.matchMedia('(min-width:1024px)');
  var TAB = window.matchMedia('(min-width:600px)');
  var MAIN = ['home', 'reserve', 'confirm', 'feedback', 'record', 'team', 'recurring', 'settings'];
  var NAV = [['home', '오늘'], ['recurring', '정기'], ['team', '팀'], ['record', '기록'], ['settings', '설정']];

  /* 데스크톱 로그인 전: 왼쪽 브랜드 패널 */
  function brandPanel() {
    var dl = S.settings.deadline;
    return '<section class="da-brand">' + bowl('glance', 200) +
      '<h1>눈치밥</h1><div class="mono" style="font-size:20px;font-weight:600;margin-top:8px">nunchi-bap</div>' +
      '<div class="postit" style="--r:-2deg;--d:300ms;margin-top:36px;padding:22px 24px 18px;width:max-content;max-width:100%"><div class="tape"></div><div style="font-size:26px;font-weight:900">눈치 보지 말고, 눈치 있게</div><div style="font-size:16px;margin-top:6px">밥 먹을 타이밍, 눈치밥이 알려 줄게!</div></div>' +
      '<div class="da-steps"><div><span class="t">~' + esc(dl) + '</span><span class="w">아침에 고르기</span><span class="s">휴대폰 내기 전 칸 하나</span></div><div><span class="t">' + esc(S.settings.lunchStart) + '~</span><span class="w">점심엔 그냥 가기</span><span class="s">교실 화면에 갈 팀이 떠요</span></div><div><span class="t">하교 후</span><span class="w">세 번 누르기</span><span class="s">내일 예측이 정확해져요</span></div></div></section>';
  }
  /* 데스크톱 첫 카드: 브랜드는 왼쪽에 있으니 시작 버튼만 */
  function vSplashCard() {
    return '<div class="screen" style="padding:40px 36px 36px"><div style="flex:1;display:flex;flex-direction:column;justify-content:center">' +
      '<div class="mono" style="font-size:12px;color:var(--grey)">' + esc(S.settings.schoolName) + ' 외 학교용</div>' +
      '<h2 style="margin:6px 0 0;font-size:32px;font-weight:900;letter-spacing:-1px;line-height:1.25">급식 줄,<br>이제 눈치 보지 마세요</h2>' +
      '<p style="margin:14px 0 0;font-size:15px;line-height:1.7;color:#333">점심시간을 5분 칸으로 나누고, 꽉 찬 칸은 덜 붐비는 칸으로 추천해요. 학교 이메일로 가입하면 우리 학교 혼잡 예상을 바로 볼 수 있어요.</p>' +
      '<div style="margin-top:28px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:2px solid var(--ink);border-left:2px solid var(--ink);background:var(--white)">' +
      ['f', 'm', 'b', 'b', 'm', 'y', 'f', 'f', 'f', 'f'].map(function (k, j) { return '<span class="stag k-' + k + '" style="--i:' + j + ';display:block;height:36px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink)"></span>'; }).join('') + '</div></div>' +
      '<button class="primary btn" data-act="go" data-arg="email">학교 이메일로 시작하기</button><p style="margin:10px 0 0;font-size:12px;color:var(--grey);text-align:center">학교에서 받은 이메일만 쓸 수 있어요</p></div>';
  }
  function deskAuth() {
    var body = ui.screen === 'splash' ? vSplashCard() : views[ui.screen]();
    return '<div class="da">' + brandPanel() + '<section class="da-card">' + body + '</section></div>';
  }
  function deskMain() {
    var cur = ui.screen === 'home' ? 'reserve' : ui.screen;
    var navCur = ['home', 'reserve', 'confirm', 'feedback'].indexOf(ui.screen) >= 0 ? 'home' : ui.screen;
    var u = S.user;
    var nav = NAV.map(function (x) { return '<button class="btn" data-act="go" data-arg="' + x[0] + '" aria-current="' + (navCur === x[0] ? 'page' : 'false') + '">' + x[1] + '</button>'; }).join('');
    return '<div class="dw"><header class="dw-top"><div class="dw-brand">' + LOGO + '<span>눈치밥</span><span class="mono">nunchi-bap</span></div><nav class="dw-nav" aria-label="메뉴">' + nav + '</nav>' +
      '<div class="dw-me"><span><b>' + esc(u.name || '친구') + '</b> · ' + esc(S.settings.schoolName) + ' ' + esc(u.grade) + '-' + esc(u.cls) + '</span>' + (NBSync.active ? '<button class="btn" data-act="nav" data-arg="admin">관리자 웹 →</button>' : '') + '</div></header>' +
      '<div class="dw-body"><section class="pane pane-today" aria-label="오늘">' + vHome() + '</section><section class="pane pane-work">' + views[cur]() + '</section></div></div>';
  }

  function render() {
    S = NB.load();
    if (!S.user && MAIN.indexOf(ui.screen) >= 0) ui.screen = 'splash';
    if (S.user) NB.ensureTeam();
    var focusId = document.activeElement && document.activeElement.id, selStart = null;
    try { if (focusId && document.activeElement.selectionStart != null) selStart = document.activeElement.selectionStart; } catch (e) { /* 무시 */ }
    var mode = DESK.matches ? 'desk' : TAB.matches ? 'tab' : 'phone';
    var html;
    if (NBSync.active && !NBSync.ready) html = '<div class="m-full" style="align-items:center;justify-content:center">' + bowl('glance', 96) + '<p class="mono" style="margin:12px 0 0;font-size:13px;color:var(--grey)">불러오는 중…</p></div>';
    else if (mode === 'desk') html = MAIN.indexOf(ui.screen) >= 0 && S.user ? deskMain() : deskAuth();
    else html = '<div class="' + (mode === 'tab' ? 'm-desk' : 'm-full') + '"><div class="phone">' + views[ui.screen]() + '</div></div>';
    if (ui.toast) html += '<div class="toast" role="status">' + esc(ui.toast) + '</div>';
    /* 같은 화면 안의 갱신이면 등장 애니메이션을 다시 돌리지 않는다 */
    var scrolls = [].map.call(app.querySelectorAll('.scroll'), function (el) { return el.scrollTop; });
    var key = mode + ':' + ui.screen;
    app.innerHTML = html;
    if (lastKey === key) {
      app.querySelectorAll('.screen,.stag,.postit,.pop,.grow,.slide,.sheet,.dim,.stamp').forEach(function (el) { el.style.animation = 'none'; });
      app.querySelectorAll('.scroll').forEach(function (el, i) { if (scrolls[i]) el.scrollTop = scrolls[i]; });
    }
    lastKey = key;
    if (focusId) { var el = document.getElementById(focusId); if (el) { el.focus(); try { if (selStart != null) el.setSelectionRange(selStart, selStart); } catch (e) { /* 무시 */ } } }
  }
  function toast(msg) { ui.toast = msg; render(); clearTimeout(toast.t); toast.t = setTimeout(function () { ui.toast = null; render(); }, 2200); }
  function go(s) { ui.screen = s; ui.picked = null; ui.rec = false; ui.justSent = ui.justSent && s === 'record'; lastKey = null; render(); }
  DESK.addEventListener('change', function () { lastKey = null; render(); });
  TAB.addEventListener('change', function () { lastKey = null; render(); });

  app.addEventListener('input', function (e) {
    var b = e.target.getAttribute('data-bind'); if (!b) return;
    var v = e.target.value; if (b === 'code') v = v.replace(/[^0-9]/g, '').slice(0, 6);
    ui[b] = v; render();
  });
  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el) return;
    var act = el.getAttribute('data-act'), arg = el.getAttribute('data-arg');
    var t = NB.targetDate();
    switch (act) {
      case 'go': go(arg); break;
      case 'nav': NBSync.nav(arg); break;
      case 'fill': ui.email = arg; render(); break;
      case 'fillcode': ui.code = '482913'; render(); break;
      case 'request': S.requests.push({ domain: emailKind().dom, at: new Date().toISOString() }); NB.save(); toast('도입 요청을 보냈어요. 선생님께 전해 주세요!'); break;
      case 'grade': ui.grade = arg; render(); break;
      case 'cls': ui.cls = arg; render(); break;
      case 'signup':
        S.user = { email: ui.email.trim().toLowerCase(), grade: ui.grade, cls: ui.cls, name: ui.name.trim(), points: 0, notif1: true, notif2: true, introDone: false, createdAt: new Date().toISOString() };
        S.team.members = []; NB.ensureTeam(); NB.save(); ui.intro = 0; ui.introFrom = 'signup'; go('intro'); break;
      case 'introNext': if (ui.intro < 3) { ui.intro++; render(); } else endIntro(); break;
      case 'introEnd': endIntro(); break;
      case 'replayIntro': ui.intro = 0; ui.introFrom = 'settings'; go('intro'); break;
      case 'pick': ui.picked = arg; ui.rec = false; render(); break;
      case 'rec': ui.rec = true; render(); break;
      case 'recClose': ui.rec = false; render(); break;
      case 'book': NB.book(t, arg, NB.isToday(t) ? '오늘만 변경' : '내일만 변경'); go('confirm'); break;
      case 'choose': { var from = ui.picked; NB.book(t, arg, '추천 수락'); S.recLog.push({ date: NB.dateKey(t), from: from, to: arg, accepted: true }); S.user.points = (S.user.points || 0) + (NB.recommend(t, from)[0] && NB.recommend(t, from)[0].time === arg ? 10 : 5); NB.save(); go('confirm'); break; }
      case 'waitlist': S.waitlist[NB.dateKey(t)] = arg; S.recLog.push({ date: NB.dateKey(t), from: arg, to: null, accepted: false }); NB.save(); ui.rec = false; ui.picked = null; toast(arg + ' 대기 명단에 올렸어요. 자리가 나면 ' + S.settings.deadline + ' 전에 알려 줄게요.'); break;
      case 'fb': ui.fb[el.getAttribute('data-key')] = arg; render(); break;
      case 'fbout': ui.fbOut[arg] = !ui.fbOut[arg]; render(); break;
      case 'sendfb': { var present = S.team.members.filter(function (m) { return !ui.fbOut[m.name]; }).map(function (m) { return m.name; }); NB.sendFeedback(now(), { ate: ui.fb.ate, timing: ui.fb.timing, bucket: ui.fb.bucket, present: present }); ui.justSent = true; ui.fb = { ate: '예', timing: '예약대로', bucket: null }; ui.fbOut = {}; ui.screen = 'record'; render(); break; }
      case 'present': S.team.members[+arg].present = S.team.members[+arg].present === false; NB.save(); render(); break;
      case 'inviteToggle': ui.invite = !ui.invite; render(); break;
      case 'addMember': if (ui.inviteName.trim()) { S.team.members.push({ name: ui.inviteName.trim(), cls: S.user.grade + '-' + S.user.cls, lead: false, present: true }); NB.save(); ui.inviteName = ''; ui.invite = false; toast('팀에 추가했어요'); } break;
      case 'leadNext': { var ms = S.team.members, li = -1; ms.forEach(function (m, i) { if (m.lead) li = i; }); if (ms.length > 1) { ms.forEach(function (m) { m.lead = false; }); ms[(li + 1) % ms.length].lead = true; NB.save(); toast(ms[(li + 1) % ms.length].name + '이(가) 대표가 됐어요'); } break; }
      case 'copy': try { navigator.clipboard.writeText(arg).then(function () { toast('초대코드를 복사했어요'); }, function () { toast('초대코드 ' + arg); }); } catch (x) { toast('초대코드 ' + arg); } break;
      case 'period': S.recurring.period = arg; NB.save(); render(); break;
      case 'editDay': { var d = el.getAttribute('data-d'), j = +el.getAttribute('data-j'); ui.editDay = ui.editDay && ui.editDay.d === d && ui.editDay.j === j ? null : { d: d, j: j }; render(); break; }
      case 'setDay': if (ui.editDay) { var arr = (S.recurring.days[ui.editDay.d] || ['', '', '']).slice(); arr[ui.editDay.j] = arg; S.recurring.days[ui.editDay.d] = arr; /* 자동 예약은 다시 계산 */ Object.keys(S.bookings).forEach(function (k) { if (S.bookings[k].auto) delete S.bookings[k]; }); NB.save(); ui.editDay = null; render(); } break;
      case 'toggle': S.user[arg] = !S.user[arg]; NB.save(); render(); break;
      case 'privacy': ui.privacy = !ui.privacy; render(); break;
      case 'logout': S.user = null; NB.save(); ui.email = ''; ui.code = ''; ui.intro = 0; go('splash'); break;
    }
  });
  function endIntro() { if (!S.user.introDone) { S.user.introDone = true; NB.save(); } go(ui.introFrom === 'settings' ? 'settings' : 'home'); }

  window.addEventListener('storage', function (e) { if (!NBSync.active && e.key === NB.KEY) { NB.reload(); render(); } });
  NBSync.init(function (first) {
    S = NB.load();
    if (first && S.user && S.user.introDone && ['splash', 'email', 'code', 'profile', 'nope'].indexOf(ui.screen) >= 0) ui.screen = 'home';
    render();
  });
  render();
  setInterval(function () { if (ui.screen === 'home') render(); }, 60000);
})();
</script>

</body>
</html>
